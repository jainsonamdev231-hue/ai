<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniBrain AI — Ultimate Multi-AI & Roast Engine</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app-layout">
    <!-- LEFT SIDEBAR: PERMANENT MEMORY VAULT & ROAST LAB -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>🧠 Memory Vault</h2>
        <button class="close-sidebar-btn" onclick="toggleSidebar()">✖</button>
      </div>
      <p class="sidebar-sub">Teach the AI permanent facts (friends' names, inside jokes, school details).</p>

      <div class="fact-form">
        <input type="text" id="fact-key" placeholder="Topic (e.g., Best Friend)" />
        <input type="text" id="fact-val" placeholder="Detail (e.g., Always late to class)" />
        <button onclick="saveFact()">+ Save to AI Brain</button>
      </div>

      <div class="fact-list" id="fact-list"></div>

      <div class="roast-presets">
        <h3>🔥 Quick Roast Modes</h3>
        <button onclick="triggerPresetRoast('Hinglish School Slang')">🎒 Hinglish School Roast (2-3 Words)</button>
        <button onclick="triggerPresetRoast('Pure Hindi Savage')">🇮🇳 Desi Hindi Comeback (2-3 Words)</button>
        <button onclick="triggerPresetRoast('English Brutal Witty')">⚡ English Savage Comeback</button>
        <button onclick="triggerPresetRoast('Smart Intellectual Burn')">🧐 High-IQ Genius Burn</button>
      </div>

      <div class="sidebar-footer">
        <button class="danger-btn" onclick="wipeHistory()">🗑️ Clear Chat History</button>
        <button class="export-btn" onclick="exportChat()">📥 Download Chat (.txt)</button>
      </div>
    </aside>

    <!-- MAIN CHAT WORKSPACE -->
    <main class="main-panel">
      <header class="top-nav">
        <div class="brand-group">
          <button class="menu-btn" onclick="toggleSidebar()">☰ Vault</button>
          <h1>OmniBrain <span>PRO</span></h1>
          <span class="status-dot" id="status-dot" title="All Free AIs Connected"></span>
        </div>

        <div class="nav-selectors">
          <!-- AI ENGINE SELECTOR -->
          <select id="ai-mode" title="Select AI Brain">
            <option value="council">⚡ All AIs Combined (Council Mode)</option>
            <option value="gemini">💎 Gemini Flash Latest (Your Key)</option>
            <option value="gpt">🤖 OpenAI GPT-4o (100% Free)</option>
            <option value="deepseek">🐋 DeepSeek R1/V3 (100% Free)</option>
            <option value="llama">🦙 Meta Llama 3.3 70B (100% Free)</option>
            <option value="mistral">🌪️ Mistral Large (100% Free)</option>
            <option value="qwen">💻 Qwen 2.5 Coder (100% Free)</option>
          </select>

          <!-- REPLY LANGUAGE / SLANG SELECTOR -->
          <select id="reply-lang" title="Reply Language & Vibe">
            <option value="Auto-Detect (Match User Language)">🌍 Auto-Match My Language</option>
            <option value="Hinglish (Indian School/College Slang)">🇮🇳 Hinglish (Desi Slang)</option>
            <option value="Pure Hindi (देवनागरी / हिंदी)">🇮🇳 Hindi (हिंदी)</option>
            <option value="English (Sharp & Witty)">🇺🇸 English (Sharp)</option>
            <option value="Punjabi + Hinglish Mix">🦁 Punjabi / Hinglish Vibe</option>
            <option value="Spanish / Español">🇪🇸 Spanish</option>
            <option value="Japanese + Anime Vibe">🇯🇵 Japanese / Anime Vibe</option>
            <option value="Russian">🇷🇺 Russian</option>
            <option value="Arabic">🇸🇦 Arabic</option>
            <option value="French">🇫🇷 French</option>
          </select>

          <!-- VOICE ACCENT SELECTOR -->
          <select id="voice-lang" title="Speaker & Mic Accent">
            <option value="en-IN">🎙️ Indian Accent (en-IN)</option>
            <option value="hi-IN">🎙️ Hindi Voice (hi-IN)</option>
            <option value="en-US">🎙️ US Voice (en-US)</option>
            <option value="en-GB">🎙️ UK Voice (en-GB)</option>
            <option value="es-ES">🎙️ Spanish Voice</option>
            <option value="ja-JP">🎙️ Japanese Voice</option>
          </select>

          <button id="mute-btn" onclick="toggleVoiceOutput()">🔊 Voice: ON</button>
        </div>
      </header>

      <!-- CHAT STREAM -->
      <section id="chat-box" class="chat-stream"></section>

      <!-- QUICK ACTION CHIPS -->
      <div class="chip-bar">
        <span class="chip" onclick="quickPrompt('Give me 5 savage 2-3 word roasts in Hinglish, Hindi, and English for someone acting oversmart.')">🔥 Roast Oversmart Friend</span>
        <span class="chip" onclick="quickPrompt('Give me 5 brutal 2-3 word comebacks when someone says: Who asked you?')">⚡ Comeback to "Who Asked?"</span>
        <span class="chip" onclick="quickPrompt('Give me real, practical advice on how to handle fake friends in school.')">🧠 Advice: Fake Friends</span>
        <span class="chip" onclick="quickPrompt('Pitch me a unique viral web app or game idea we can code next.')">💻 Next Coding Idea</span>
      </div>

      <!-- INPUT COMPOSER -->
      <footer class="composer">
        <button id="mic-btn" onclick="startListening()" title="Speak with Microphone">🎙️</button>
        <textarea id="user-input" rows="1" placeholder="Ask for unfiltered advice, code, or type who to roast in any language..."></textarea>
        <button class="send-btn" onclick="sendMessage()">Send 🚀</button>
        <button class="roast-btn" onclick="quickRoast()">🔥 2-3 Word Roast</button>
      </footer>
    </main>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
