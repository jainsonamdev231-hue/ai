<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniBrain GOD MODE — Multi-AI & Savage Roast Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- LEFT SIDEBAR: PERMANENT MEMORY VAULT & ROAST PRESETS -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>🧠 Memory Vault</h2>
        <button type="button" class="close-sidebar-btn" onclick="toggleSidebar()" title="Close Sidebar">✖</button>
      </div>

      <p class="sidebar-sub" id="runtime-badge">Detecting runtime environment...</p>

      <div class="fact-form">
        <input type="password" id="local-gemini-key" placeholder="Paste Gemini Key (For GitHub-only mode)" />
        <button type="button" onclick="saveLocalKey()">🔑 Save Gemini Key</button>
      </div>

      <div class="fact-form">
        <input type="text" id="fact-key" placeholder="Topic (e.g., Best Friend)" />
        <input type="text" id="fact-val" placeholder="Detail (e.g., Always acts oversmart)" />
        <button type="button" onclick="saveFact()">+ Save Fact to Brain</button>
      </div>

      <div class="fact-list" id="fact-list"></div>

      <div class="roast-presets">
        <h3>🔥 Instant Roast Styles</h3>
        <button type="button" onclick="triggerPresetRoast('Hinglish School Slang')">🎒 Hinglish School Roast (2-3 Words)</button>
        <button type="button" onclick="triggerPresetRoast('Pure Hindi Savage')">🇮🇳 Desi Hindi Comeback (2-3 Words)</button>
        <button type="button" onclick="triggerPresetRoast('English Brutal Witty')">⚡ English Savage Comeback</button>
        <button type="button" onclick="triggerPresetRoast('High-IQ Genius Burn')">🧐 Smart Intellectual Burn</button>
      </div>

      <div class="sidebar-footer">
        <button type="button" class="danger-btn" onclick="wipeHistory()">🗑️ Clear Chat</button>
        <button type="button" class="export-btn" onclick="exportChat()">📥 Export .txt</button>
      </div>
    </aside>

    <!-- MAIN PANEL: TOP NAVIGATION, CHAT STREAM & COMPOSER -->
    <main class="main-panel">
      <header class="top-nav">
        <div class="brand-group">
          <button type="button" class="menu-btn" onclick="toggleSidebar()">☰ Vault</button>
          <h1>OmniBrain <span>GOD</span></h1>
          <span class="status-dot" id="status-dot" title="System Online"></span>
        </div>

        <div class="nav-selectors">
          <select id="ai-mode" title="Choose AI Engine">
            <option value="council">⚡ All AIs Combined (Council)</option>
            <option value="gemini">💎 Gemini Flash Latest</option>
            <option value="gpt">🤖 OpenAI GPT-4o (100% Free)</option>
            <option value="deepseek">🐋 DeepSeek V3 (100% Free)</option>
            <option value="llama">🦙 Meta Llama 3.3 (100% Free)</option>
            <option value="mistral">🌪️ Mistral Large (100% Free)</option>
            <option value="qwen">💻 Qwen 2.5 Coder (100% Free)</option>
          </select>

          <select id="reply-lang" title="Choose Reply Language">
            <option value="Auto-Detect (Match User Language)">🌍 Auto-Match My Language</option>
            <option value="Hinglish (Indian School/College Slang)">🇮🇳 Hinglish (Desi Slang)</option>
            <option value="Pure Hindi (देवनागरी / हिंदी)">🇮🇳 Hindi (हिंदी)</option>
            <option value="English (Sharp & Witty)">🇺🇸 English (Sharp)</option>
            <option value="Punjabi + Hinglish Mix">🦁 Punjabi / Hinglish</option>
            <option value="Spanish / Español">🇪🇸 Spanish</option>
            <option value="Japanese">🇯🇵 Japanese</option>
            <option value="Russian">🇷🇺 Russian</option>
            <option value="Arabic">🇸🇦 Arabic</option>
            <option value="French">🇫🇷 French</option>
          </select>

          <select id="voice-lang" title="Voice & Mic Accent">
            <option value="en-IN">🎙️ Indian Accent (en-IN)</option>
            <option value="hi-IN">🎙️ Hindi Voice (hi-IN)</option>
            <option value="en-US">🎙️ US Voice (en-US)</option>
            <option value="en-GB">🎙️ UK Voice (en-GB)</option>
            <option value="ja-JP">🎙️ Japanese Voice</option>
          </select>

          <button type="button" id="mute-btn" onclick="toggleVoiceOutput()">🔊 Voice: ON</button>
        </div>
      </header>

      <section id="chat-box" class="chat-stream"></section>

      <div class="chip-bar">
        <span class="chip" onclick="quickPrompt('Give me 6 savage 2-to-3 word roasts in Hinglish, Hindi, and English for someone acting oversmart.')">🔥 Roast Oversmart</span>
        <span class="chip" onclick="quickPrompt('Give me 6 brutal 2-to-3 word comebacks when someone says: Who asked you?')">⚡ Beat "Who Asked?"</span>
        <span class="chip" onclick="quickPrompt('Give me honest, practical advice on handling fake friends in school.')">🧠 Fake Friends Advice</span>
        <span class="chip" onclick="quickPrompt('Pitch me a viral game or web app idea we can code next.')">💻 Next Coding Idea</span>
      </div>

      <!-- Direct Text Box + Send & Roast Buttons -->
      <div class="composer">
        <button type="button" id="mic-btn" onclick="startListening()" title="Speak into Microphone">🎙️</button>
        <input
          type="text"
          id="user-input"
          autocomplete="off"
          placeholder="Type your own message, question, or who to roast..."
        />
        <button type="button" id="send-btn" class="send-btn" onclick="sendMessage()">Send 🚀</button>
        <button type="button" id="roast-btn" class="roast-btn" onclick="quickRoast()">🔥 2-3 Word Roast</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
